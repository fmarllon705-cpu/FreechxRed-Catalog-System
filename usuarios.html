<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Gestão do Sistema • Venous</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="scripts/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/script.js" defer></script>
    <script defer src="scripts/chat.js"></script>
    <script src="scripts/gestao.js" defer></script>
    <meta name="theme-color" content="#0369a1">
    <link rel="stylesheet" href="scripts/hub.css">
    <link rel="stylesheet" href="scripts/mobile.css">
    <script src="scripts/hub.js" defer></script>
    <script src="scripts/gestao-hub.js" defer></script>
    <script src="scripts/mobile.js" defer></script>
</head>
<body data-acesso="admin">

<header>
    <div class="header-content">
        <div class="logo-box">
            <div>
                <h1>Venous</h1>
                <h3>Administração e Controle de Acesso</h3>
            </div>
        </div>
    </div>
</header>

<nav class="main-nav">
    <div class="nav-container">
        <a href="index.html" class="nav-tab" id="tabNavAcervo"><i class="fa-solid fa-book-open-reader"></i> Acervo</a>
        <a href="catalogacao.html" class="nav-tab" id="tabNavCatalogacao" style="display: none;"><i class="fa-solid fa-layer-group"></i> Catalogação</a>
        <a href="usuarios.html" class="nav-tab active" id="tabNavUsuarios" style="display: none;"><i class="fa-solid fa-chart-pie"></i> Gestão</a>
    </div>
</nav>

<main class="container">
    <div id="contentUsuarios">
        <div class="tabs" id="hubGestao" role="tablist">
            <button type="button" data-gp="usuarios"><i class="fa-solid fa-users-gear"></i> Usuários</button>
            <button type="button" data-gp="relatorios"><i class="fa-solid fa-chart-column"></i> Relatórios</button>
            <button type="button" data-gp="mensagens"><i class="fa-solid fa-inbox"></i> Mensagens <span id="msgBadge" class="chat-badge hidden">0</span></button>
        </div>
        <div id="gpUsuarios">
        <div class="card">
            <div class="card-header">
                <span class="card-title" id="tituloFormUsuario"><i class="fa-solid fa-user-plus"></i> Cadastrar Novo Usuário / Equipe</span>
            </div>

            <form id="formUsuario" onsubmit="cadastrarUsuario(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="usrNome">Nome Completo</label>
                        <input type="text" id="usrNome" required placeholder="Nome Completo">
                    </div>
                    <div class="form-group">
                        <label for="usrUsuario">Identidade de Login</label>
                        <input type="text" id="usrUsuario" required placeholder="Login">
                    </div>
                    <div class="form-group">
                        <label for="usrEmail">E-mail</label>
                        <input type="email" id="usrEmail" required placeholder="email@dominio.com">
                    </div>
                    <div class="form-group">
                        <label for="usrSenha">Senha</label>
                        <input type="password" id="usrSenha" required placeholder="******">
                    </div>
                    <div class="form-group">
                        <label for="usrCargo">Cargo / Perfil</label>
                        <select id="usrCargo" required>
                            <option value="usuario">Usuário (Leitor)</option>
                            <option value="estagiario">Estagiário</option>
                            <option value="bibliotecario">Bibliotecário (Admin)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group" style="margin-top:15px; display:flex; gap: 8px;">
                    <button type="submit" id="btnSubmitUsuario" class="btn btn-primary"><i class="fa-solid fa-check"></i> Cadastrar Usuário</button>
                    <button type="button" id="btnCancelarEdicaoUsuario" class="btn btn-outline" style="display:none;" onclick="cancelarEdicaoUsuario()"><i class="fa-solid fa-xmark"></i> Cancelar Edição</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-users"></i> Usuários Cadastrados</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Usuário</th>
                            <th>E-mail</th>
                            <th>Cargo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbUsuarios">
                        <tr><td colspan="5">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
</div>
        <div id="gpRelatorios" style="display:none">
            <div class="toolbar"><select id="relPer"><option value="3">Últimos 3 meses</option><option value="6" selected>Últimos 6 meses</option><option value="12">Últimos 12 meses</option></select><button class="btn btn-outline" id="relExport"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button></div>
            <div id="relConteudo"><div class="hint">Carregando relatórios…</div></div>
        </div>
        <div id="gpMensagens" style="display:none">
            <div class="toolbar"><select id="msgFiltro"><option value="aberto">Abertas</option><option value="resolvido">Resolvidas</option><option value="">Todas</option></select></div>
            <div id="msgLista"></div>
        </div>
    </div>
</main>
</body>
</html>
