<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Circulação & Empréstimos • Venous</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="scripts/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/script.js" defer></script>
    <script defer src="scripts/chat.js"></script>
    <script src="scripts/gestao.js" defer></script>
</head>
<body data-acesso="staff">

<header>
    <div class="header-content">
        <div class="logo-box">
            <div>
                <h1>Venous</h1>
                <h3>Módulo de Circulação</h3>
            </div>
        </div>
    </div>
</header>

<nav class="main-nav">
    <div class="nav-container">
        <a href="index.html" class="nav-tab active"><i class="fa-solid fa-house"></i> Home / Consulta</a>
        <a href="minha-area.html" class="nav-tab" id="tabNavPerfil" style="display: none;"><i class="fa-solid fa-id-card-clip"></i> Minha Área</a>
        <a href="circulacao.html" class="nav-tab" id="tabNavCirculacao" style="display: none;"><i class="fa-solid fa-arrows-rotate"></i> Circulação</a>
        <a href="catalogacao.html" class="nav-tab" id="tabNavCatalogacao" style="display: none;"><i class="fa-solid fa-file-pen"></i> Catalogação</a>
        <a href="suporte.html" class="nav-tab"><i class="fa-solid fa-headset"></i> Suporte</a>
        <a href="usuarios.html" class="nav-tab" id="tabNavUsuarios" style="display: none;"><i class="fa-solid fa-users-gear"></i> Gestão de Usuários</a>
        <a href="lixeira.html" class="nav-tab" id="tabNavLixeira" style="display: none;"><i class="fa-solid fa-trash-can"></i> Lixeira</a>
    </div>
</nav>

<main class="container">
    <div class="grid-two-columns">
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-hand-holding-hand"></i> Registrar Empréstimo</span>
            </div>
            <form id="formEmprestimo" onsubmit="registrarEmprestimo(event)">
                <div class="form-group">
                    <label for="selectLivroEmprestimo">Livro do Acervo</label>
                    <select id="selectLivroEmprestimo" required><option value="">Selecione...</option></select>
                </div>
                <div class="form-group">
                    <label for="selectUsuarioEmprestimo">Usuário Solicitante</label>
                    <select id="selectUsuarioEmprestimo" required><option value="">Selecione...</option></select>
                </div>
                <div class="form-group">
                    <label for="dataDevolucaoPrevista">Data Prevista de Devolução</label>
                    <input type="date" id="dataDevolucaoPrevista" required>
                </div>
                <div class="btn-group" style="margin-top:10px;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key"></i> Confirmar Empréstimo</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-list-check"></i> Empréstimos Ativos</span>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Livro</th>
                            <th>Usuário</th>
                            <th>Devolução</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaEmprestimosBody">
                        <tr><td colspan="4">Nenhum empréstimo ativo.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
